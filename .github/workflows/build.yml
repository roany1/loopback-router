name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Unit tests + real-clock audio test (PulseAudio null sinks stand in for BlackHole/VB-CABLE)
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config pulseaudio pulseaudio-utils libasound2-plugins sox
      - name: Rust tests
        run: cargo test --no-default-features
      - name: Build + Python tests
        run: |
          python -m venv .venv && source .venv/bin/activate
          pip install maturin pytest numpy
          maturin develop --release
          pytest -q tests
      - name: Integration test (audio reale con clock indipendenti)
        run: |
          source .venv/bin/activate
          bash tests/integration/pulse_loopback.sh 20

  build-app:
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon (arm64)
            script: bash scripts/build_mac.sh
            artifact: dist/LoopbackRouter-macos-*.zip
          # Intel Macs: add an x86_64 macOS runner here if your account has one.
          - os: windows-latest
            script: pwsh scripts/build_windows.ps1
            artifact: dist/LoopbackRouter-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ${{ matrix.script }} 2>&1 | tee build.log || {
            # Surface the tail of the log as an annotation (readable via the API too)
            tail -n 40 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1' | sed 's/^/::error title=Build failed::/'
            echo
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: loopback-router-${{ matrix.os }}
          path: ${{ matrix.artifact }}

  # Releases: pushing a tag vX.Y.Z publishes it; a push to main whose Cargo.toml
  # version has no matching tag yet creates tag + release automatically.
  release:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: build-app
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Decide tag
        id: tag
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "name=v$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "v$VER" >/dev/null; then
            echo "v$VER already released, skipping"; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tag.outputs.go == 'true'
        uses: actions/download-artifact@v4
        with: { path: artifacts }
      - if: steps.tag.outputs.go == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Loopback Router ${{ steps.tag.outputs.name }}
          body: |
            Build automatiche per macOS (Apple Silicon) e Windows x64.
            Eseguibili non firmati: al primo avvio macOS/SmartScreen chiederanno conferma.
            Non ancora testato su hardware Mac/Windows reale. Per l'instradamento tra app servono BlackHole (macOS) o VB-CABLE (Windows).
          files: artifacts/**/*.zip
