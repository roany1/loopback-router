[package]
name = "loopback_engine"
version = "0.1.0"
edition = "2021"
authors = ["Roany Romano"]
license = "Apache-2.0"
description = "Audio routing engine for Loopback Router"

[lib]
name = "loopback_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
cpal = "0.18"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"], optional = true }
ringbuf = "0.5"

[features]
default = ["python"]
python = ["dep:pyo3"]

[profile.release]
opt-level = 3
lto = true
